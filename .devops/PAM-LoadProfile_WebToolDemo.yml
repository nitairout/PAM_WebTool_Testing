trigger: none  # Disable automatic triggers; rely on the webhook.

variables:
  - name: BuildParameters.antBuildFile
    value: PAM_LoadProfileTest_build.xml

name: $(date:yyyyMMdd)$(rev:.r)

resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/Test_WebExecutionToolBranch
  webhooks:
    - webhook: summitJiraWebHook
      connection: scSummitJirawebhook

jobs:
  - job: Run_Tests
    displayName: Execute TestNG Tests
    pool:
      vmImage: windows-latest
    steps:
      - checkout: self
        clean: true
      - task: PowerShell@2
        displayName: "Validate Test Case Modules"
        inputs:
          targetType: "inline"
          script: |
            $testCaseModules = "${{ parameters.summitJiraWebHook.parameters.testCaseModules }}"
            Write-Host "Received testCaseModules: $testCaseModules"
            if ($testCaseModules -match "Load Profile Analysis") {
              Write-Host "Sanity Test found. Proceeding with the pipeline."
            } else {
              Write-Host "Sanity Test not found. Exiting the pipeline."
              exit 1
            }
      - task: Ant@1
        displayName: Clean and Compile
        inputs:
          antBuildFile: PAM_LoadProfileTest_build.xml
          targets: clean, compile
          jdkVersion: 1.11
      - task: Ant@1
        displayName: Run TestNG Tests
        inputs:
          antBuildFile: PAM_LoadProfileTest_build.xml
          targets: run
          jdkVersion: 1.11
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Test Artifacts'
        condition: succeededOrFailed()
        inputs:
          PathtoPublish: $(System.DefaultWorkingDirectory)/test-output
          ArtifactName: TestResults
      - task: citrus-andriessen.cag-sendgrid.custom-build-release-task.SendGrid@1
        displayName: 'SendGrid'
        condition: succeededOrFailed()
        inputs:
          sendgridkey: $(SendGrid_API_Key)
          to: ${{ parameters.summitJiraWebHook.parameters.emailAddress }}
          from: no-reply@ems.schneider-electric.com
          subject: 'PAM WebTool Testing: $(Build.DefinitionName) - Automation Result from Azure on Stage : $(Agent.JobStatus)'
          htmlbody: >-
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta http-equiv="X-UA-Compatible" content="IE=edge">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title></title>
            </head>
            <body>
                <p>Hello,</p>
                <p>Please find the attached Automated test report along with the build information for your reference.</p>
                <p><strong>Build Name:</strong> $(Build.DefinitionName)</p>
                <p><strong>Requested By:</strong> $(Build.RequestedFor)</p>
                <p><strong>Branch Name:</strong> $(Build.SourceBranchName)</p>
                <p><em>NOTE: Please do not reply to this auto-generated email.</em></p>
                <p>Thank you for your attention.</p>
                <p>Best regards,</p>
                <p>Automation Team.</p>
                <p>Cambridge Technology.</p>
            </body>
            </html>
          addattachment: true
          attachment: $(System.DefaultWorkingDirectory)/test-output/emailable-report.html

  - job: TransitionJiraIssue
    displayName: 'Transition Jira Issue'
    dependsOn: Run_Tests  # Ensures this job runs only after Run_Tests finishes
    condition: always()  # Ensures this job runs regardless of the outcome of Run_Tests
    pool:
      vmImage: windows-latest
    steps:
      - powershell: |
          $jiraUserEmailAddress = "$(jiraUserEmailAddress)"  # Updated variable name
          $jiraApiToken = "$(jiraApiToken)"  # Updated variable name (stored as a secret)
          $testPlan = "QD-2"
          $transitionId = "31"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$jiraUserEmailAddress`:$jiraApiToken"))
          $apiUrl = "https://summit-sandbox-388.atlassian.net/rest/api/3/issue/$env:issueKey/transitions"

          Write-Host "Transitioning issue: $testPlan"
          $jsonPayload = @{
            transition = @{ id = $transitionId }
          } | ConvertTo-Json -Depth 10

          $headers = @{
            Authorization = "Basic $auth"
            "Content-Type" = "application/json"
          }

          $response = Invoke-RestMethod -Uri $apiUrl -Method Post -Headers $headers -Body $jsonPayload
          Write-Host "Response: $($response | ConvertTo-Json -Depth 10)"
        displayName: 'Execute Jira Issue Transition'
        env:
          jiraUserEmailAddress: $(jiraUserEmailAddress)
          jiraApiToken: $(jiraApiToken)
          issueKey: ${{ parameters.summitJiraWebHook.parameters.testplan }}
